<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>銘柄えらび帳 公開版</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F9EFCB; --head:#FFE699; --ink:#385723; --steel:#7B4A21; --volt:#B92613;
  --volt-deep:#8C1B0D; --card:#FFFDF2; --line:#DFCF9A; --ok:#3E6B2A; --cream:#FFF3D6;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Noto Sans Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:600;
  font-size:15px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0)}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
a{color:var(--volt-deep)}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--head);padding:10px 14px;z-index:10}
.skip:focus{left:8px;top:8px}

/* ヘッダー: head色の帯＋下辺に ink 3px。左にロゴ、右に言語切り替えとシンボルマーク */
header.site{background:var(--head);border-bottom:3px solid var(--ink);padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.logo{height:40px;width:auto;flex:none}
.titles{flex:1 1 220px;min-width:0}
h1{margin:0;font-size:clamp(19px,4.2vw,26px);font-weight:800;letter-spacing:.05em;line-height:1.35}
html[lang=en] h1{letter-spacing:.02em}
.updated{margin:2px 0 0;color:var(--steel);font-weight:700;font-size:13px;letter-spacing:.02em}
.langs{display:flex;gap:0;flex:none}
.langs button{font:inherit;font-size:14px;font-weight:700;min-height:44px;min-width:44px;padding:0 14px;background:var(--card);
  color:var(--ink);border:1px solid var(--ink);cursor:pointer}
.langs button+button{border-left:0}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--head)}
.mark{height:34px;width:auto;flex:none}
@media (max-width:560px){.logo{height:30px}.mark{display:none}.langs{order:3}}

main{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
nav.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
nav.jump a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:var(--card);
  color:var(--ink);border:1px solid var(--ink);text-decoration:none;font-weight:700;letter-spacing:.03em}
nav.jump a:hover{background:var(--head)}

section{margin:0 0 34px}
h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.04em;margin:0 0 12px;
  padding-bottom:6px;border-bottom:2px solid var(--ink)}
html[lang=en] h2{letter-spacing:.01em}
h2 img{height:18px;width:auto}
.lead{margin:0 0 12px;color:var(--steel);font-weight:700;font-size:14px;max-width:60em}
.policy{background:var(--card);border:1px solid var(--line);padding:12px 14px;margin:0 0 18px;font-size:14px}
.policy dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.policy dt{color:var(--steel);font-weight:800;letter-spacing:.06em}
.policy dd{margin:0}

/* 操作 */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:0 0 14px}
.ctl label,.ctl .lbl{display:block;font-size:12px;font-weight:800;color:var(--steel);letter-spacing:.06em;margin-bottom:4px}
select,input[type=search]{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--ink);
  min-height:44px;padding:0 10px;border-radius:0}
input[type=search]{width:min(260px,100%)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 14px;background:var(--card);color:var(--ink);
  border:1px solid var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--head)}
.count{color:var(--steel);font-weight:700;font-size:14px;margin:0 0 8px}

/* 銘柄カード */
ol.stocks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.stock{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);padding:14px 16px}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.rank{font-family:var(--mono);font-weight:800;font-size:15px;background:var(--volt);color:var(--cream);
  min-width:34px;height:34px;display:grid;place-items:center;padding:0 6px}
.name{font-size:17px;font-weight:800;line-height:1.45;margin:0;word-break:break-word}
.sub{color:var(--steel);font-weight:700;font-size:13px;margin:2px 0 0}
.score{text-align:right;font-family:var(--mono);font-weight:800;color:var(--volt-deep);font-size:26px;line-height:1}
.score small{display:block;font-family:var(--sans);font-size:11px;color:var(--steel);font-weight:700;letter-spacing:.06em;margin-top:4px}
.meter{grid-column:1/-1;height:6px;background:var(--line);margin:8px 0 2px}
.meter i{display:block;height:100%;background:var(--ink)}
.tags{margin:10px 0 0;display:grid;gap:4px;font-size:14px}
.tags p{margin:0}
.tl{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;padding:1px 8px;margin-right:8px}
.tl.good{background:var(--ok);color:var(--cream)}
.tl.warn{background:var(--volt-deep);color:var(--cream)}
dl.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
@media (min-width:720px){dl.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:980px){dl.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}}
dl.metrics div{min-width:0}
dl.metrics dt{font-size:12px;color:var(--steel);font-weight:800;letter-spacing:.04em}
dl.metrics dd{margin:0}
.val{font-family:var(--mono);font-weight:800;color:var(--volt-deep);font-size:16px}
.jd{display:block;font-size:12.5px;font-weight:700;line-height:1.45}
.jd.good{color:var(--ok)} .jd.mid{color:var(--ink)} .jd.warn{color:var(--volt-deep)} .jd.na{color:var(--steel)}
.legend{font-size:13px;color:var(--steel);font-weight:700;margin:8px 0 0}
.empty{background:var(--card);border:1px dashed var(--ink);padding:18px;text-align:center}

/* AI候補 */
.ai-grid{display:grid;gap:18px}
@media (min-width:900px){.ai-grid{grid-template-columns:1fr 1fr}}
.ai-col h3{margin:0 0 8px;font-size:17px;font-weight:800;letter-spacing:.04em}
ol.picks{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:p}
ol.picks li{background:var(--card);border:1px solid var(--line);padding:12px 14px;counter-increment:p}
ol.picks .pn{font-weight:800;font-size:16px}
ol.picks .pn::before{content:counter(p) ". ";font-family:var(--mono);color:var(--volt-deep)}
ol.picks .pm{color:var(--steel);font-size:13px;font-weight:700;margin:0 0 4px}
ol.picks p{margin:4px 0 0;font-size:14px}
.both{background:var(--card);border:1px solid var(--ink);border-left-width:5px;padding:10px 14px;margin:0 0 14px;font-size:14px}

/* 解説・目安 */
.commentary{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px;
  white-space:pre-wrap;font-size:14.5px;line-height:1.8;max-width:62em}
ul.guide{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:720px){ul.guide{grid-template-columns:1fr 1fr}}
@media (min-width:980px){ul.guide{grid-template-columns:1fr 1fr 1fr}}
ul.guide li{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);padding:12px 14px}
ul.guide h3{margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:.03em}
ul.guide .bm{margin:0 0 6px;color:var(--volt-deep);font-weight:800;font-size:14px}
ul.guide .ex{margin:0;font-size:13.5px;color:var(--steel);font-weight:700}

footer.site{border-top:3px solid var(--ink);background:var(--card);padding:18px 16px 28px}
footer .in{max-width:1080px;margin:0 auto;font-size:13px;color:var(--steel);font-weight:700}
footer p{margin:0 0 8px}
.sign{letter-spacing:.06em}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<header class="site">
  <div class="bar">
    <img class="logo" id="logo" src="assets/5garashi_logotype_outlined.svg" alt="">
    <div class="titles">
      <h1 id="title"></h1>
      <p class="updated" id="updated"></p>
    </div>
    <div class="langs" role="group" aria-label="言語 / Language" id="langs">
      <button type="button" data-lang="ja" lang="ja">日本語</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <img class="mark" src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true">
  </div>
</header>

<main id="main">
  <nav class="jump" id="jump"></nav>

  <section id="ranking" aria-labelledby="h-ranking">
    <h2 id="h-ranking"><img src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true"><span data-i="nav.ranking"></span></h2>
    <p class="lead" data-i="rank.lead"></p>
    <div class="policy" id="policy"></div>
    <div class="controls">
      <div class="ctl">
        <label for="sort" data-i="sort"></label>
        <select id="sort"></select>
      </div>
      <div class="ctl">
        <span class="lbl" id="src-lbl" data-i="source"></span>
        <div class="seg" role="group" aria-labelledby="src-lbl" id="srcs"></div>
      </div>
      <div class="ctl">
        <label for="q" data-i="search"></label>
        <input type="search" id="q" autocomplete="off">
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <ol class="stocks" id="stocks"></ol>
    <p class="legend" data-i="legend"></p>
    <p class="legend" id="excluded"></p>
  </section>

  <section id="ai" aria-labelledby="h-ai" hidden>
    <h2 id="h-ai"><img src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true"><span data-i="nav.ai"></span></h2>
    <p class="lead" id="ai-lead"></p>
    <div id="ai-both"></div>
    <div class="ai-grid" id="ai-grid"></div>
  </section>

  <section id="commentary" aria-labelledby="h-com" hidden>
    <h2 id="h-com"><img src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true"><span data-i="nav.comment"></span></h2>
    <p class="lead" id="com-lead"></p>
    <div class="commentary" id="com-text"></div>
  </section>

  <section id="guide" aria-labelledby="h-guide">
    <h2 id="h-guide"><img src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true"><span data-i="guide.title"></span></h2>
    <p class="lead" data-i="guide.lead"></p>
    <ul class="guide" id="guide-body"></ul>
  </section>
</main>

<footer class="site">
  <div class="in">
    <p data-i="disclaimer"></p>
    <p class="sign">5garashi.com設計事務所 / 5garashi.com Design Office — <a href="https://www.5garashi.com">https://www.5garashi.com</a> — <span id="ver"></span></p>
  </div>
</footer>

irectly with pure manufacturers.\n- **What to check:** In the earnings materials, look at what drove operating profit up or down (tariffs, currency, cost cuts), profit by region (especially North America), and the separate financials of the auto and finance businesses.\n- 🔎 **Latest results:** Q1 results (August 4) showed revenue up 10.4% but operating profit down 8.8% to ¥1.06 trillion, as tariffs and the Middle East situation raised costs. Toyota still raised its full-year operating profit forecast from ¥3.0 trillion to ¥3.4 trillion and announced a share buyback.\n\n## #2 CF Industries Holdings, Inc. (CF)\n- **Strengths:** ROE is a high 29.9% and PER is a low 8.5x. Revenue grew 17.6%, and the quarterly dividend was raised 20% in July.\n- **Risks:** Nitrogen fertilizer is a cyclical business, so profits swing with market prices. Today's strong earnings come largely from higher selling prices caused by a global supply shortage linked to the Iran conflict. Keep in mind that PER looks lowest when profits are at their peak. Sales volumes fell 15% year on year, and earnings include insurance proceeds.\n- **What to check:** Ammonia and urea price trends, natural gas costs (the main raw material), whether volumes recover, and how much of the profit is one-off. Also look at PER based on average earnings over several years.\n- 🔎 **Latest results:** Q2 results (August) showed net earnings of $727 million, about 1.9x the prior year, on revenue of $2.22 billion, up from the prior year. Results still missed estimates, and the shares slipped afterward.\n\n## #3 ORIX Corporation (8591.T)\n- **Strengths:** PER is 11.0x, PBR 1.43x, dividend yield 2.75% and revenue growth 17.4%. It is a diversified financial group that actively buys back shares.\n- **Risks:** Recent profit includes about ¥121.7 billion of one-off gains from selling and revaluing its Kioxia stake, which can make PER and ROE look better than the underlying business. The data sources also disagree: Yahoo! shows ROE of tio (whether the dividend can be sustained).\n- **What to check:** Growth excluding currency effects, profit by region, profitability of heated tobacco, the payout ratio and shareholder-return policy, and how the Russia business is handled and disclosed.\n- 🔎 **Latest results:** First-half results (July 30) showed a large rise in revenue and profit from price increases and strong Ploom sales, and the full-year forecast was raised (including profit up 29%).\n\n## Overall bias\nFour of the five are Japanese stocks, and the list leans heavily toward low-PER, high-dividend value stocks. Most are cyclical sectors (autos, fertilizer, housing, finance) exposed to tariffs, interest rates and geopolitical risk, while growth sectors such as tech and healthcare are missing. Also, CF and ORIX may look better than usual because of temporary factors, so don't judge the scores on a single year's numbers alone.\n\n---\n*This is an explanation of how to read the indicators. It is not a recommendation to buy or sell, and not a price forecast.*\n\nSources:\n- [Toyota: April–June 2026 Financial Results (Toyota Newsroom)](https://pressroom.toyota.com/tmc-announces-april-through-june-2026-financial-results/)\n- [Toyota boosts guidance, announces share buyback (Yahoo Finance)](https://finance.yahoo.com/markets/stocks/article/toyota-boosts-guidance-announces-6-billion-share-buyback-as-fiscal-q1-results-shine-170431398.html)\n- [CF Industries First Half 2026 Earnings](https://www.cfindustries.com/newsroom/2026/1h-2026-earnings)\n- [CF Industries Q2 2026 earnings miss (Investing.com)](https://www.investing.com/news/transcripts/earnings-call-transcript-cf-industries-misses-q2-2026-estimates-as-shares-slip-93CH-4843506)\n- [ORIX Q1 FY27.3 slides: record profit, new dividend policy (Investing.com)](https://www.investing.com/news/company-news/orix-q1-fy273-slides-record-profit-new-dividend-policy-93CH-4840351)\n- [ORIX Q1 earnings (BigGo Finance)](https://finance.biggo.com/news/JP_8591.T_2026-08       "rank.aria": "{r}位", "score": "スコア", "score.aria": "スコア {s}点", "src.prefix": "出典: ",
      "good": "強み", "warn": "注意", "price": "株価", "sep": "、", "list.sep": " / ",
      "ai.lead": "作成: {t}　条件: {c}。AIが挙げた「調べる候補」で、理由には誤りや古い情報が含まれる可能性があります。",
      "ai.match": "一致", "ai.both": "両方のAIが挙げた銘柄: ", "ai.of": "{l}の候補",
      "ai.in": "候補ランキング {r}位・スコア {s}", "ai.out": "候補ランキング外（条件外または取得できず）",
      "ai.reason": "理由", "ai.risk": "注意", "ai.notes": "補足",
      "com.lead": "作成: {t}。候補ランキング上位の銘柄について、Claude が数値をもとに書いた解説です。",
      "guide.title": "指標の一般的な目安",
      "guide.lead": "投資の入門書や証券会社の解説でよく使われる目安です。公式の基準ではなく、業種や時期によって適切な水準は変わります。同じ業種の会社どうしで比べるのが基本です。",
      "guide.bm": "目安: ",
      "disclaimer": "このページは、PCのアプリ「銘柄えらび帳」で集計した結果を公開したものです。特定の銘柄の売買を勧めるものではありません。株価・指標は Yahoo!ファイナンスから取得した値で、欠けや遅れがあり得ます。AIの候補と解説は Claude と ChatGPT が作成したもので、誤りや古い情報を含む可能性があります。投資の判断は、企業の決算資料や証券会社の画面で最新の値を確認したうえで、ご自身で行ってください。",
      "ver": "銘柄えらび帳 v{v}", "logo": "5garashi.com設計事務所", "logo.file": "5garashi_logotype_outlined.svg"
    },
    en: {
      "skip": "Skip to content",
      "updated": "Updated: {t} JST (aggregated on a PC)",
      "nav.label": "Jump to section", "nav.ranking": "Candidate ranking", "nav.ai": "AI suggestions",
      "nav.comment": "Claude's commentary", "nav.guide": "Benchmarks",
      "rank.lead": "The score compares the stocks in this list with each other (0–100). “Strengths”, “Cautions” and the per-metric judgments compare each value with common benchmarks.",
      "pol.preset": "Policy", "pol.weights": "Weights", "pol.filters": "Filters", "pol.none": "none", "pol.range": " (0–5)",
      "sort": "Sort by", "sort.rank": "Score, high to low", "sort.div": "Dividend yield, high to low", "sort.per": "PER, low to high",
      "sort.roe": "ROE, high to low", "sort.growth": "Revenue growth, high to low",
      "source": "Source", "all": "All", "search": "Search by name or code", "search.ph": "e.g. 7203, Toyota",
      "count": "Showing {m} of {n} stocks", "none": "No stocks match. Change the source or search term.",
      "legend": "Symbols: ◎ favorable side of the benchmark   ○ standard   △ cautionary side   − not judged",
      "excluded": "Excluded by filters: ",
      "rank.aria": "Rank {r}", "score": "Score", "score.aria": "Score {s}", "src.prefix": "Source: ",
      "good": "Strengths", "warn": "Cautions", "price": "Price", "sep": ", ", "list.sep": " / ",
      "ai.lead": "Created: {t}. Conditions: {c}. These are stocks the AI suggests researching; the reasons may contain errors or outdated information.",
      "ai.match": "Match", "ai.both": "Suggested by both AIs: ", "ai.of": "{l}'s suggestions",
      "ai.in": "Ranking #{r}, score {s}", "ai.out": "Not in the ranking (filtered out or not found)",
      "ai.reason": "Reason", "ai.risk": "Caution", "ai.notes": "Notes",
      "com.lead": "Created: {t}. Commentary written by Claude on the top-ranked stocks, based on the figures.",
      "guide.title": "Common benchmarks",
      "guide.lead": "Rules of thumb often used in beginner investment books and broker guides. They are not official standards, and the right level varies by industry and period. Compare companies within the same industry.",
      "guide.bm": "Benchmark: ",
      "disclaimer": "This page publishes results aggregated with the PC app “Stock Picks Notebook”. It does not recommend buying or selling any stock. Prices and metrics come from Yahoo! Finance and may be missing or delayed. AI suggestions and commentary were written by Claude and ChatGPT and may contain errors or outdated information. Check the latest figures in company filings or with your broker, and make your own investment decisions.",
      "ver": "Stock Picks Notebook v{v}", "logo": "5garashi.com Design Office", "logo.file": "5garashi_logotype_en_outlined.svg"
    }
  };

  // 表示言語: 前回選んだ言語 → ブラウザの言語 の順に決める（保存できない環境でも動く）
  var lang = null;
  try { lang = localStorage.getItem("meigara-lang"); } catch (e) {}
  if (lang !== "ja" && lang !== "en") lang = /^ja/i.test(navigator.language || "") ? "ja" : "en";

  function u(key, vars) {
    var s = (UI[lang] && UI[lang][key]) || UI.ja[key] || "";
    if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function tr(obj) { return obj == null ? "" : (typeof obj === "string" ? obj : (obj[lang] != null ? obj[lang] : obj.ja)); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs) {
      if (a === "text") n.textContent = attrs[a];
      else if (a === "cls") n.className = attrs[a];
      else n.setAttribute(a, attrs[a]);
    }
    (kids || []).forEach(function (k) { if (k) n.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
    return n;
  }
  function fmt(k, v) {
    if (v === null || v === undefined) return "−";
    var d = (k === "pbr" || k === "div") ? 2 : 1;
    return v.toLocaleString(lang === "en" ? "en-US" : "ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }) + tr(D.metrics[k].unit);
  }

  var state = { sort: "rank", src: "all", q: "" };
  var hasAI = D.ai && Object.keys(D.ai).length > 0;

  // ---- 静的な文言と見出し
  function renderStatic() {
    document.documentElement.lang = lang;
    document.title = tr(D.titles);
    document.getElementById("title").textContent = tr(D.titles);
    document.getElementById("updated").textContent = u("updated", { t: D.generated_at });
    var logo = document.getElementById("logo");
    logo.src = "assets/" + u("logo.file"); logo.alt = u("logo");
    document.getElementById("ver").textContent = u("ver", { v: D.app_version });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (n) { n.textContent = u(n.getAttribute("data-i")); });
    Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    document.getElementById("q").placeholder = u("search.ph");

    var jump = document.getElementById("jump");
    jump.setAttribute("aria-label", u("nav.label"));
    jump.textContent = "";
    var jumps = [["#ranking", "nav.ranking"]];
    if (hasAI) jumps.push(["#ai", "nav.ai"]);
    if (D.commentary) jumps.push(["#commentary", "nav.comment"]);
    jumps.push(["#guide", "nav.guide"]);
    jumps.forEach(function (j) { jump.appendChild(el("a", { href: j[0], text: u(j[1]) })); });

    // 方針
    var pol = document.getElementById("policy"); pol.textContent = "";
    var dl = el("dl");
    function row(tk, d) { dl.appendChild(el("dt", { text: u(tk) })); dl.appendChild(el("dd", { text: d })); }
    row("pol.preset", tr(D.policy.preset) || "−");
    row("pol.weights", D.policy.weights.map(function (w) { return tr(D.metrics[w.key].label) + " " + w.weight; }).join(u("sep")) + u("pol.range"));
    var f = tr(D.policy.filters) || [];
    row("pol.filters", f.length ? f.join(u("sep")) : u("pol.none"));
    pol.appendChild(dl);

    // 並べ替え
    var sel = document.getElementById("sort"); sel.textContent = "";
    ["rank", "div", "per", "roe", "growth"].forEach(function (v) {
      if (v !== "rank" && !D.show_numbers) return;
      var o = el("option", { value: v, text: u("sort." + v) }); if (v === state.sort) o.selected = true; sel.appendChild(o);
    });

    // 出典
    var seg = document.getElementById("srcs"); seg.textContent = "";
    var ids = ["all"];
    D.stocks.forEach(function (s) { s.source.forEach(function (x) { if (ids.indexOf(x) < 0) ids.push(x); }); });
    ids.forEach(function (id) {
      var b = el("button", { type: "button", "aria-pressed": String(id === state.src), text: id === "all" ? u("all") : tr(D.sources[id]) });
      b.addEventListener("click", function () {
        state.src = id;
        Array.prototype.forEach.call(seg.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); });
        renderList();
      });
      seg.appendChild(b);
    });

    document.getElementById("excluded").textContent = D.excluded.length ? u("excluded") +
      D.excluded.map(function (e) { return e.name + "（" + e.code + "）"; }).join(u("sep")) : "";
  }

  // ---- 銘柄カード
  function card(s) {
    var top = el("div", { cls: "top" }, [
      el("span", { cls: "rank", "aria-label": u("rank.aria", { r: s.rank }), text: String(s.rank) }),
      el("div", null, [
        el("h3", { cls: "name", text: s.name }),
        el("p", { cls: "sub", text: [s.code, s.sector, s.source.length ? u("src.prefix") + s.source.map(function (x) { return tr(D.sources[x]); }).join(u("sep")) : ""].filter(Boolean).join(u("list.sep")) })
      ]),
      el("div", { cls: "score", "aria-label": u("score.aria", { s: s.score }) }, [String(s.score), el("small", { text: u("score") })]),
      (function () { var m = el("div", { cls: "meter", "aria-hidden": "true" }); var i = el("i"); i.style.width = s.score + "%"; m.appendChild(i); return m; })()
    ]);
    var tags = el("div", { cls: "tags" });
    var gd = tr(s.good) || [], wn = tr(s.warn) || [];
    if (gd.length) tags.appendChild(el("p", null, [el("span", { cls: "tl good", text: u("good") }), gd.join(u("sep"))]));
    if (wn.length) tags.appendChild(el("p", null, [el("span", { cls: "tl warn", text: u("warn") }), wn.join(u("sep"))]));
    var dl = el("dl", { cls: "metrics" });
    K.forEach(function (k) {
      var m = s.metrics[k];
      var dd = el("dd");
      if (D.show_numbers) dd.appendChild(el("span", { cls: "val", text: fmt(k, m.value) }));
      dd.appendChild(el("span", { cls: "jd " + m.kind }, [el("span", { "aria-hidden": "true", text: MARK[m.kind] + " " }), tr(m.judge)]));
      dl.appendChild(el("div", null, [el("dt", { text: tr(D.metrics[k].label) }), dd]));
    });
    var extra = null;
    if (D.show_numbers && s.price !== null) extra = el("p", { cls: "sub", text: u("price") + " " + s.price.toLocaleString(lang === "en" ? "en-US" : "ja-JP") + " " + s.currency });
    return el("li", null, [el("article", { cls: "stock", "aria-label": u("rank.aria", { r: s.rank }) + " " + s.name }, [top, extra, tags.children.length ? tags : null, dl])]);
  }
  function val(s, k) { var v = s.metrics[k].value; return v === null ? null : v; }
  function renderList() {
    var list = D.stocks.filter(function (s) {
      if (state.src !== "all" && s.source.indexOf(state.src) < 0) return false;
      if (state.q && (s.name + " " + s.code).toLowerCase().indexOf(state.q) < 0) return false;
      return true;
    }).slice();
    var dir = { div: -1, per: 1, roe: -1, growth: -1 }[state.sort];
    if (dir) list.sort(function (a, b) {
      var x = val(a, state.sort), y = val(b, state.sort);
      if (state.sort === "per") { if (x !== null && x <= 0) x = null; if (y !== null && y <= 0) y = null; }
      if (x === null) return 1; if (y === null) return -1;
      return (x - y) * dir;
    });
    var ol = document.getElementById("stocks");
    ol.textContent = "";
    if (!list.length) ol.appendChild(el("li", { cls: "empty", text: u("none") }));
    list.forEach(function (s) { ol.appendChild(card(s)); });
    document.getElementById("count").textContent = u("count", { n: D.stocks.length, m: list.length });
  }

  // ---- AI候補
  function renderAI() {
    if (!hasAI) return;
    document.getElementById("ai").hidden = false;
    var c = D.ai_conditions || {};
    var cond = [tr(c.market), tr(c.preset)].filter(Boolean).join(" / ") + (c.extra ? " / " + u("ai.notes") + ": " + c.extra : "");
    document.getElementById("ai-lead").textContent = u("ai.lead", { t: D.ai_generated_at || "−", c: cond || "−" });
    var seen = {}, both = [];
    Object.keys(D.ai).forEach(function (src) {
      (D.ai[src].picks || []).forEach(function (p) { seen[p.code] = (seen[p.code] || 0) + 1; if (seen[p.code] === 2) both.push(p); });
    });
    var bothBox = document.getElementById("ai-both"); bothBox.textContent = "";
    if (both.length) bothBox.appendChild(el("p", { cls: "both" }, [
      el("span", { cls: "tl good", text: u("ai.match") }),
      u("ai.both") + both.map(function (p) { return tr(p.name) + "（" + p.code + "）"; }).join(u("sep"))
    ]));
    var grid = document.getElementById("ai-grid"); grid.textContent = "";
    Object.keys(D.ai).forEach(function (src) {
      var a = D.ai[src];
      var col = el("div", { cls: "ai-col" }, [el("h3", { text: u("ai.of", { l: a.label }) })]);
      if (a.error) { col.appendChild(el("p", { cls: "empty", text: tr(a.error) })); grid.appendChild(col); return; }
      var ol = el("ol", { cls: "picks" });
      a.picks.forEach(function (p) {
        var risk = tr(p.risk);
        ol.appendChild(el("li", null, [
          el("div", { cls: "pn", text: tr(p.name) }),
          el("p", { cls: "pm", text: p.code + u("list.sep") + (p.rank ? u("ai.in", { r: p.rank, s: p.score }) : u("ai.out")) }),
          el("p", null, [el("span", { cls: "tl good", text: u("ai.reason") }), tr(p.reason)]),
          risk ? el("p", null, [el("span", { cls: "tl warn", text: u("ai.risk") }), risk]) : null
        ]));
      });
      col.appendChild(ol);
      grid.appendChild(col);
    });
  }

  // ---- 解説
  function renderCommentary() {
    if (!D.commentary) return;
    document.getElementById("commentary").hidden = false;
    document.getElementById("com-lead").textContent = u("com.lead", { t: D.commentary.generated_at || "−" });
    var box = document.getElementById("com-text");
    box.setAttribute("lang", lang);
    box.textContent = tr(D.commentary.text).replace(/\*\*/g, "").replace(/^#{1,6}\s*/gm, "");
  }

  // ---- 目安
  function renderGuide() {
    var gb = document.getElementById("guide-body"); gb.textContent = "";
    K.forEach(function (k) {
      var m = D.metrics[k];
      gb.appendChild(el("li", null, [
        el("h3", { text: tr(m.name) }),
        el("p", { cls: "bm", text: u("guide.bm") + tr(m.benchmark) }),
        el("p", { cls: "ex", text: tr(m.short) })
      ]));
    });
  }

  function renderAll() { renderStatic(); renderList(); renderAI(); renderCommentary(); renderGuide(); }

  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); renderList(); });
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("meigara-lang", lang); } catch (e) {}
      renderAll();
      b.focus();
    });
  });
  renderAll();
})();
</script>
</body>
